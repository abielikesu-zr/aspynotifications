      destination: bot-installed-vscode-destination
  - action: create-policy
    options:
      name: ingestion-started-notification-policy
      subject: ingestion.started
      destination: ingestion-started-vscode-destination
  - action: create-policy
    options:
      name: ingestion-completed-notification-policy
      subject: ingestion.completed
      destination: ingestion-completed-vscode-destination
  - action: create-policy
    options:
      name: ingestion-failed-notification-policy
      subject: ingestion.failed
      destination: ingestion-failed-vscode-destination
  - action: create-policy
    options:
      name: document-changed-notification-policy
      subject: document.changed
      destination: document-changed-vscode-destination
  - action: create-policy
    options:
      name: bot-response-cache-invalidated-notification-policy
      subject: bot_response.cache_invalidated
      destination: bot-response-cache-invalidated-vscode-destination
  - action: create-policy
    options:
      name: ci-notification-policy
      subject: ci.>
      destination: ci-vscode-destination
  - action: update-policy-by-name
    options:
