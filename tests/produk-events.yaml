commands:
  - action: create-slack-provider
    options:
      name: slack-provider
      webhook-url: XXX
  - action: create-template
    options:
      name: entity-created-slack-template
    file_options:
      slack-blocks-inline: tests/notification-templates/entity.created-slack.yaml
  - action: create-slack-channel-destination
    options:
      name: entity-slack-destination
      provider: slack-provider
      template: entity-created-slack-template
  - action: create-policy
    options:
      name: entity-created-notification-policy
      subject: "*.created"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-updated-notification-policy
      subject: "*.updated"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-deleted-notification-policy
      subject: "*.deleted"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-started-notification-policy
      subject: "*.started"
      destination: entity-slack-destination
      negative-envelope-policy:
        - exclude-ingestion-started
        - envelope.type == 'ingestion.started'
        - Ingestion started has its own Slack destination
  - action: create-policy
    options:
      name: entity-feedback-positive-notification-policy
      subject: "*.feedback_positive"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-feedback-negative-notification-policy
      subject: "*.feedback_negative"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-from-cache-notification-policy
      subject: "*.from_cache"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-regenerated-notification-policy
      subject: "*.regenerated"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-cached-notification-policy
      subject: "*.cached"
      destination: entity-slack-destination
  - action: create-policy
    options:
      name: entity-cache-invalidated-notification-policy
      subject: "*.cache_invalidated"
      destination: entity-slack-destination
      negative-envelope-policy:
        - exclude-bot-response-cache-invalidated
        - envelope.type == 'bot_response.cache_invalidated'
        - Bot response cache invalidation has its own Slack destination
  - action: create-policy
    options:
      name: entity-generated-notification-policy
      subject: "*.generated"
      destination: entity-slack-destination
  - action: create-policy
