# Type: NotificationsSdkParams
notifications_sdk:

  # Type: HttpClientConfig
  http_client:

    # Maximum time in seconds to wait for an HTTP request to complete.

    # Type: float

    timeout: "5.0"

    # Maximum number of times a failed HTTP request is retried.

    # Type: int

    max_retries: "1"

    # Initial backoff delay in seconds used before retrying a failed request.

    # Type: float

    backoff_base: "0.15"

    # Maximum backoff delay in seconds between retry attempts.

    # Type: float

    backoff_max: "1.0"

    # Whether TLS certificates are verified for HTTPS requests.

    # Type: bool

    verify: True

  # Type: RestClientConfig | NatsClientConfig
  # Switch Variable: g_app_ns_client_type
  client:
    type: "NATS"

    config:

      nats_url: "nats://127.0.0.1:4222"

      username: null

      password: null

      tls_ca_file: null

      tls_cert_file: null

      tls_key_file: null