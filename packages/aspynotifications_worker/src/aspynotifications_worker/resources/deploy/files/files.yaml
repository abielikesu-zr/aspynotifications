aspynotifications_worker:
  deploy:
    copy_files:
      - src: notification-templates
        dest: "{{ install_dir }}/notification-templates/"
      - src: bootstrap
        dest: "{{ install_dir }}/bootstrap/"
    directories:
      - path: "{{ install_dir }}/notification-templates"
        permissions: "0700"
      - path: "{{ install_dir }}/bootstrap"
        permissions: "0700"
      - path: "/var/log/aspynotifications_worker/patches"
        permissions: "0700"  
