aspynotifications_worker:
  deploy:
    copy_files:
      - src: bootstrap
        dest: "{{ install_dir }}/bootstrap/"
      - src: aspynotifications_sdk.yaml
        dest: "{{ install_dir }}/config/aspynotifications_sdk.yaml"
    directories:
      - path: "{{ install_dir }}/bootstrap/001-init"
        permissions: "0700"
      - path: "/var/log/aspynotifications_worker/patches"
        permissions: "0700"  
