name: document-changed-slack-template
slack:
  blocks:
    inline: "blocks:\n  - type: section\n    text:\n      type: mrkdwn\n      text:
      >-\n        \U0001F4C4 *Document changed:* `{{ event.document_name }}` · Document:
      `{{ event.document_id }}` · Tenant: `{{ context.tenant_id }}` · Knowledge base:
      `{{ context.kb_id }}` · Updated at: `{{ event.last_updated_at }}`"
