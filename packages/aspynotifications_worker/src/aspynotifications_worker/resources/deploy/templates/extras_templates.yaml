aspynotifications_worker:
  deploy:
    templates:
      - src: aspynotifications_worker_extra.yaml.j2
        dest: "{{ install_dir }}/config/aspynotifications_worker_extra.yaml"
        permissions: "0600"
      - src: 001-slack-provider.yaml.j2
        dest: "{{ install_dir }}/bootstrap/001-init/001-slack-provider.yaml"
        permissions: "0600"
      - src: aspytracing.yaml.j2
        dest: "{{ install_dir }}/bootstrap/001-init/config/aspytracing.yaml"
        permissions: "0600"
      - src: aspynotifications.yaml.j2
        dest: "{{ install_dir }}/bootstrap/001-init/config/aspynotifications.yaml"
        permissions: "0600"
      
