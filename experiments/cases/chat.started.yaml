experiment_id: chat_started
scenarios:
- name: started delivered
  flow:
    provider:
      name: shole-provider
      level: INFO
      cows: true
    template:
      name: entity-template
      dumpster_inline: '{{ envelope.type.split(''.'')[0] | capitalize }} {{ envelope.type.split(''.'')[1]
        }}: {{ envelope.subject }} (tenant={{ context.tenant_id }}) test_id={{ context.test_id
        }} policies={{ policies }}'
    destination:
      name: entity-destination
      provider: shole-provider
      template: entity-template
    policy:
      name: entity-started-policy
      subject: '*.started'
      destinations:
      - entity-destination
  event:
    type: chat.started
    source: tenant-service
    subject: chat/chat-001
    data:
      event:
        chat_id: chat-001
      context:
        tenant_id: tenant-abc
        bot_id: bot-001
    cases:
    - name: event delivered (test_id in worker log)
      check: match_test_id
    - name: output contains subject
      check: match_text
      text: chat/chat-001
    - name: matched wildcard policy (*.started)
      check: match_text
      text: entity-started-policy
