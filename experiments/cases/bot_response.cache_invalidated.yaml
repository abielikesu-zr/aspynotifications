experiment_id: bot_response_cache_invalidated
scenarios:
  - name: cache invalidated delivered
    flow:
      provider:
        name: shole-provider
        level: INFO
        cows: true

      template:
        name: entity-template
        dumpster_inline:
          "{{ envelope.type.split('.')[0] | capitalize }} {{ envelope.type.split('.')[1]
          }}: {{ envelope.subject }} (tenant={{ context.tenant_id }}) test_id={{ context.test_id
          }} policies={{ policies }}"

      destination:
        name: entity-destination
        provider: shole-provider
        template: entity-template

      policy:
        name: wildcard-cache-invalidated-policy
        subject: "*.cache_invalidated"
        destinations:
          - entity-destination

    event:
      type: bot_response.cache_invalidated
      source: tenant-service
      subject: bot_response/cache-001
      data:
        event:
          cache_key: cache-001
        context:
          tenant_id: tenant-abc
          bot_id: bot-001

      cases:
        - name: event delivered (test_id in worker log)
          check: match_test_id

        - name: output contains subject
          check: match_text
          text: bot_response/cache-001

        - name: matched wildcard policy (*.cache_invalidated)
          check: match_text
          text: wildcard-cache-invalidated-policy
